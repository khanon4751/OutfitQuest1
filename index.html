<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outfit Quest: ADHD & ASD Dressing Game</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler for Inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS for Keyframes and Animations -->
  <style>
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes shiver {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-3px) rotate(-1deg); }
      40% { transform: translateX(3px) rotate(1deg); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }
    @keyframes melt-sweat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px) scaleY(0.97); }
    }
    .animate-shiver {
      animation: shiver 0.3s infinite;
    }
    .animate-sweat {
      animation: melt-sweat 1.2s infinite ease-in-out;
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
    /* Hide scrollbar for smooth UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-amber-400 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SOUND EFFECTS SYNTHESIZER (Web Audio API) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);

        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }

      playSuccess() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, index) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + index * 0.08);

          gain.gain.setValueAtTime(0.2, now + index * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + 0.3);
        });
      }

      playSoftWarning() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    const sfx = new SoundEffects();

    // --- GAME DATA: SCENARIOS & CLOTHING ITEMS ---
    const SCENARIOS = [
      {
        id: "rainy_school",
        title: "Rainy School Day 🌧️",
        weather: "Cold & Pouring Rain",
        activity: "Walking outside to school",
        requiredTags: ["rainproof", "warm", "waterproof_shoes"],
        hint: "Pick clothes that keep you dry from the rain and warm in cold wind!",
        bgGradient: "from-blue-900 via-slate-900 to-indigo-950",
        avatarBg: "bg-slate-900/80 border-blue-500/40",
        coldFactor: true
      },
      {
        id: "gym_class",
        title: "Gym Class & Sports ⚽",
        weather: "Warm & Sunny",
        activity: "Running & playing sports",
        requiredTags: ["breathable", "stretchy", "athletic_shoes"],
        hint: "Pick lightweight athletic clothes so you can stretch and run fast!",
        bgGradient: "from-amber-900 via-orange-950 to-slate-950",
        avatarBg: "bg-slate-900/80 border-amber-500/40",
        hotFactor: false
      },
      {
        id: "regular_school",
        title: "Regular School Day 🏫",
        weather: "Mild & Pleasant Indoor/Outdoor",
        activity: "Classroom learning & playground recess",
        requiredTags: ["comfy_top", "casual_bottom", "sneakers"],
        hint: "Pick comfortable, everyday clothing neat enough for class!",
        bgGradient: "from-teal-900 via-slate-900 to-emerald-950",
        avatarBg: "bg-slate-900/80 border-teal-500/40",
        coldFactor: false
      },
      {
        id: "fancy_party",
        title: "Grandma's Birthday Party 🎂",
        weather: "Indoor Celebration",
        activity: "Family dinner & photos",
        requiredTags: ["fancy_top", "fancy_bottom", "clean_shoes"],
        hint: "Pick dressy, clean clothes suitable for a nice party dinner!",
        bgGradient: "from-purple-900 via-slate-900 to-pink-950",
        avatarBg: "bg-slate-900/80 border-purple-500/40",
        coldFactor: false
      },
      {
        id: "beach_day",
        title: "Hot Sunny Beach Day 🏖️",
        weather: "Very Hot & Bright Sunshine",
        activity: "Playing in water & sand",
        requiredTags: ["swimwear_top", "swimwear_bottom", "sandals"],
        hint: "Pick light swimwear and open shoes to stay cool in the sun!",
        bgGradient: "from-cyan-900 via-sky-950 to-slate-950",
        avatarBg: "bg-slate-900/80 border-cyan-500/40",
        hotFactor: true
      }
    ];

    const CLOTHES_CATALOG = {
      tops: [
        { id: "raincoat", name: "Yellow Raincoat", tags: ["rainproof", "warm"], icon: "🧥", desc: "Keeps rain off!" },
        { id: "tshirt", name: "Sports T-Shirt", tags: ["breathable", "stretchy"], icon: "👕", desc: "Cool & stretchy" },
        { id: "polo", name: "School Polo Shirt", tags: ["comfy_top"], icon: "👔", desc: "Neat & comfy" },
        { id: "fancy_dress_shirt", name: "Dress Shirt / Blouse", tags: ["fancy_top"], icon: "👔", desc: "Very fancy" },
        { id: "swim_top", name: "UV Swim Shirt", tags: ["swimwear_top"], icon: "🩱", desc: "Great for beach" }
      ],
      bottoms: [
        { id: "rain_pants", name: "Waterproof Pants", tags: ["rainproof", "warm"], icon: "👖", desc: "Blocks water" },
        { id: "shorts", name: "Athletic Shorts", tags: ["stretchy", "breathable"], icon: "🩳", desc: "Easy to run in" },
        { id: "jeans", name: "Comfortable Jeans", tags: ["casual_bottom"], icon: "👖", desc: "Everyday wear" },
        { id: "fancy_skirt_pants", name: "Party Trousers / Skirt", tags: ["fancy_bottom"], icon: "👗", desc: "Dressy look" },
        { id: "swim_trunks", name: "Swim Trunks", tags: ["swimwear_bottom"], icon: "🩳", desc: "Quick dry" }
      ],
      shoes: [
        { id: "rain_boots", name: "Waterproof Boots", tags: ["waterproof_shoes"], icon: "👢", desc: "Puddle proof" },
        { id: "running_sneakers", name: "Running Sneakers", tags: ["athletic_shoes"], icon: "👟", desc: "Fast & grippy" },
        { id: "casual_sneakers", name: "Everyday Sneakers", tags: ["sneakers"], icon: "👟", desc: "Comfy steps" },
        { id: "dress_shoes", name: "Shiny Party Shoes", tags: ["clean_shoes"], icon: "👞", desc: "Very neat" },
        { id: "sandals", name: "Beach Sandals", tags: ["sandals"], icon: "🩴", desc: "Cool for toes" }
      ]
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentLevel, setCurrentLevel] = useState(0);
      const [selectedTop, setSelectedTop] = useState(null);
      const [selectedBottom, setSelectedBottom] = useState(null);
      const [selectedShoes, setSelectedShoes] = useState(null);
      
      const [activeStep, setActiveStep] = useState(1); // 1: Top, 2: Bottom, 3: Shoes
      const [feedback, setFeedback] = useState(null);
      const [completedLevels, setCompletedLevels] = useState([]);
      const [soundMuted, setSoundMuted] = useState(false);
      const [avatarReaction, setAvatarReaction] = useState("normal"); // normal, shivering, sweating, happy

      const scenario = SCENARIOS[currentLevel];

      // Reset or evaluate avatar reaction state whenever selections change
      useEffect(() => {
        let reaction = "normal";

        if (selectedTop || selectedBottom || selectedShoes) {
          const chosenTags = [
            ...(selectedTop?.tags || []),
            ...(selectedBottom?.tags || []),
            ...(selectedShoes?.tags || [])
          ];

          // Cold mission check
          if (scenario.coldFactor) {
            const hasColdGear = chosenTags.includes("rainproof") || chosenTags.includes("warm") || chosenTags.includes("waterproof_shoes");
            const hasBeachGear = chosenTags.includes("sandals") || chosenTags.includes("swimwear_top") || chosenTags.includes("swimwear_bottom");
            if (hasBeachGear || (!hasColdGear && (selectedTop || selectedShoes))) {
              reaction = "shivering";
            }
          }

          // Hot beach mission check
          if (scenario.hotFactor) {
            const hasHeavyGear = chosenTags.includes("warm") || chosenTags.includes("rainproof");
            if (hasHeavyGear) {
              reaction = "sweating";
            }
          }
        }

        setAvatarReaction(reaction);
      }, [selectedTop, selectedBottom, selectedShoes, currentLevel]);

      // Handle item selection with sound and step transition
      const handleSelectItem = (type, item) => {
        sfx.playClick();
        if (type === 'top') {
          setSelectedTop(item);
          setActiveStep(2);
        } else if (type === 'bottom') {
          setSelectedBottom(item);
          setActiveStep(3);
        } else if (type === 'shoes') {
          setSelectedShoes(item);
        }
        setFeedback(null);
      };

      const handleCheckOutfit = () => {
        if (!selectedTop || !selectedBottom || !selectedShoes) {
          sfx.playSoftWarning();
          setFeedback({
            type: "warning",
            title: "Outfit Incomplete!",
            message: "Please choose 1 Top, 1 Bottom, and 1 Pair of Shoes before checking."
          });
          return;
        }

        const chosenTags = [
          ...selectedTop.tags,
          ...selectedBottom.tags,
          ...selectedShoes.tags
        ];

        const missingTags = scenario.requiredTags.filter(tag => !chosenTags.includes(tag));

        if (missingTags.length === 0) {
          sfx.playSuccess();
          setAvatarReaction("happy");
          
          // Trigger Confetti effect
          if (window.confetti) {
            window.confetti({
              particleCount: 80,
              spread: 70,
              origin: { y: 0.6 }
            });
          }

          if (!completedLevels.includes(currentLevel)) {
            setCompletedLevels([...completedLevels, currentLevel]);
          }

          setFeedback({
            type: "success",
            title: "🌟 Mission Complete!",
            message: "Fantastic choice! Your outfit fits the weather and activity perfectly!"
          });
        } else {
          sfx.playSoftWarning();
          setFeedback({
            type: "error",
            title: "Hmm, almost there!",
            message: "Some items don't fit this weather or activity. Check the hint and try again!"
          });
        }
      };

      const handleNextLevel = () => {
        sfx.playClick();
        setSelectedTop(null);
        setSelectedBottom(null);
        setSelectedShoes(null);
        setFeedback(null);
        setActiveStep(1);
        setAvatarReaction("normal");
        setCurrentLevel((prev) => (prev + 1) % SCENARIOS.length);
      };

      const handleResetSelection = () => {
        sfx.playClick();
        setSelectedTop(null);
        setSelectedBottom(null);
        setSelectedShoes(null);
        setFeedback(null);
        setActiveStep(1);
        setAvatarReaction("normal");
      };

      const toggleSound = () => {
        sfx.muted = !soundMuted;
        setSoundMuted(!soundMuted);
      };

      return (
        <div className="max-w-5xl mx-auto p-3 sm:p-6 flex flex-col gap-5 min-h-screen">
          
          {/* HEADER BAR */}
          <header className="flex flex-col sm:flex-row items-center justify-between gap-3 p-4 bg-slate-900/90 rounded-2xl border border-slate-800 shadow-lg">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-md">
                🧥
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-black text-amber-400 tracking-wide">
                  Outfit Quest
                </h1>
                <p className="text-xs text-slate-400">ADHD & ASD Real-Life Dressing Game</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Stars Progress */}
              <div className="flex items-center gap-1.5 bg-slate-950/80 px-3 py-1.5 rounded-xl border border-amber-500/30">
                <span className="text-xs font-bold text-amber-300 uppercase tracking-wider">Missions:</span>
                <div className="flex gap-1 text-sm">
                  {SCENARIOS.map((_, idx) => (
                    <span key={idx}>
                      {completedLevels.includes(idx) ? "⭐" : "⚪"}
                    </span>
                  ))}
                </div>
              </div>

              {/* Mute/Unmute Audio Toggle */}
              <button
                onClick={toggleSound}
                className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition text-sm"
                title={soundMuted ? "Unmute Sound" : "Mute Sound"}
              >
                {soundMuted ? "🔇 Sound Off" : "🔊 Sound On"}
              </button>
            </div>
          </header>

          {/* MISSION CARD */}
          <div className={`bg-gradient-to-r ${scenario.bgGradient} p-5 sm:p-6 rounded-2xl border border-slate-700 shadow-xl relative overflow-hidden transition-all duration-500`}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <span className="text-xs font-bold tracking-widest uppercase text-amber-300 bg-slate-950/70 px-3 py-1 rounded-full border border-amber-400/20">
                Mission {currentLevel + 1} of {SCENARIOS.length}
              </span>
              <div className="flex gap-2">
                {SCENARIOS.map((sc, idx) => (
                  <button
                    key={sc.id}
                    onClick={() => {
                      setCurrentLevel(idx);
                      handleResetSelection();
                    }}
                    className={`px-2.5 py-1 text-xs rounded-lg font-bold transition ${
                      currentLevel === idx
                        ? "bg-amber-400 text-slate-950 shadow"
                        : "bg-slate-900/60 text-slate-400 hover:bg-slate-800"
                    }`}
                  >
                    Lvl {idx + 1}
                  </button>
                ))}
              </div>
            </div>

            <h2 className="text-2xl sm:text-3xl font-extrabold text-white mt-1">
              {scenario.title}
            </h2>

            <div className="flex flex-wrap gap-2.5 mt-3 text-xs sm:text-sm">
              <span className="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-slate-700 font-medium text-slate-200">
                🌡️ <strong>Weather:</strong> {scenario.weather}
              </span>
              <span className="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-slate-700 font-medium text-slate-200">
                🎯 <strong>Activity:</strong> {scenario.activity}
              </span>
            </div>

            <div className="mt-3 bg-slate-950/60 p-3 rounded-xl border border-amber-400/20 text-amber-200 text-xs sm:text-sm flex items-start gap-2">
              <span className="text-base">💡</span>
              <p><strong>Hint:</strong> {scenario.hint}</p>
            </div>
          </div>

          {/* MAIN GAME WORKSPACE */}
          <div className="grid md:grid-cols-12 gap-5">

            {/* AVATAR DISPLAY PANEL (5 Cols) */}
            <div className={`md:col-span-5 ${scenario.avatarBg} p-5 rounded-2xl border shadow-xl flex flex-col items-center justify-between min-h-[360px] relative`}>
              
              <div className="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 tracking-wider">
                <span>Avatar Stage</span>
                {avatarReaction === "shivering" && (
                  <span className="text-cyan-400 animate-pulse font-bold">🥶 Shivering!</span>
                )}
                {avatarReaction === "sweating" && (
                  <span className="text-amber-400 animate-pulse font-bold">🥵 Sweating!</span>
                )}
                {avatarReaction === "happy" && (
                  <span className="text-emerald-400 font-bold">🎉 Ready!</span>
                )}
              </div>

              {/* AVATAR BOX WITH DYNAMIC SENSORY REACTION */}
              <div className="my-auto py-6 flex flex-col items-center justify-center w-full max-w-[220px]">
                <div className={`relative flex flex-col items-center justify-center gap-1.5 bg-slate-950/90 p-6 rounded-3xl border border-slate-800 w-full shadow-2xl transition-all ${
                  avatarReaction === "shivering" ? "animate-shiver border-cyan-500/50 bg-cyan-950/30" : ""
                } ${
                  avatarReaction === "sweating" ? "animate-sweat border-amber-500/50 bg-amber-950/30" : ""
                }`}>
                  
                  {/* Reaction Overlay Cues */}
                  {avatarReaction === "shivering" && (
                    <div className="absolute -top-3 text-2xl animate-bounce">🧊❄️</div>
                  )}
                  {avatarReaction === "sweating" && (
                    <div className="absolute -top-3 text-2xl animate-bounce">💦☀️</div>
                  )}

                  {/* Character Head */}
                  <div className="text-5xl mb-1 filter drop-shadow">
                    {avatarReaction === "shivering" ? "🥶" : avatarReaction === "sweating" ? "🥵" : avatarReaction === "happy" ? "😄" : "🧑"}
                  </div>

                  {/* Top Outfit Display */}
                  <div className="w-full py-2 bg-slate-900/80 border border-slate-800 rounded-xl flex items-center justify-center min-h-[46px]">
                    {selectedTop ? (
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">{selectedTop.icon}</span>
                        <span className="text-xs font-bold text-slate-200">{selectedTop.name}</span>
                      </div>
                    ) : (
                      <span className="text-xs text-slate-600 font-medium">1. Choose Top</span>
                    )}
                  </div>

                  {/* Bottom Outfit Display */}
                  <div className="w-full py-2 bg-slate-900/80 border border-slate-800 rounded-xl flex items-center justify-center min-h-[46px]">
                    {selectedBottom ? (
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">{selectedBottom.icon}</span>
                        <span className="text-xs font-bold text-slate-200">{selectedBottom.name}</span>
                      </div>
                    ) : (
                      <span className="text-xs text-slate-600 font-medium">2. Choose Bottom</span>
                    )}
                  </div>

                  {/* Footwear Display */}
                  <div className="w-full py-2 bg-slate-900/80 border border-slate-800 rounded-xl flex items-center justify-center min-h-[46px]">
                    {selectedShoes ? (
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">{selectedShoes.icon}</span>
                        <span className="text-xs font-bold text-slate-200">{selectedShoes.name}</span>
                      </div>
                    ) : (
                      <span className="text-xs text-slate-600 font-medium">3. Choose Shoes</span>
                    )}
                  </div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="w-full flex gap-2">
                <button
                  onClick={handleResetSelection}
                  className="px-3 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs border border-slate-700 transition active:scale-95"
                >
                  Clear 🔄
                </button>
                <button
                  onClick={handleCheckOutfit}
                  className="flex-1 py-3 bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black rounded-xl text-sm tracking-wide shadow-lg transition duration-150"
                >
                  Check Outfit 🚀
                </button>
              </div>
            </div>

            {/* WARDROBE SELECTOR PANEL (7 Cols) */}
            <div className="md:col-span-7 bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col gap-4">
              
              {/* STEP NAVIGATION TABS */}
              <div className="flex rounded-xl bg-slate-950 p-1 border border-slate-800">
                <button
                  onClick={() => setActiveStep(1)}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    activeStep === 1
                      ? "bg-amber-400 text-slate-950 shadow"
                      : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  1. Tops {selectedTop && "✓"}
                </button>
                <button
                  onClick={() => setActiveStep(2)}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    activeStep === 2
                      ? "bg-amber-400 text-slate-950 shadow"
                      : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  2. Bottoms {selectedBottom && "✓"}
                </button>
                <button
                  onClick={() => setActiveStep(3)}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    activeStep === 3
                      ? "bg-amber-400 text-slate-950 shadow"
                      : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  3. Shoes {selectedShoes && "✓"}
                </button>
              </div>

              {/* STEP 1: TOPS */}
              {activeStep === 1 && (
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <p className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                      Select 1 Top Item:
                    </p>
                    <span className="text-[11px] text-slate-500">Pick the best shirt or coat</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    {CLOTHES_CATALOG.tops.map((item) => {
                      const isSelected = selectedTop?.id === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => handleSelectItem('top', item)}
                          className={`p-3 rounded-xl border text-left flex items-center gap-3 transition-all active:scale-95 ${
                            isSelected
                              ? "bg-amber-400 border-amber-300 text-slate-950 shadow-md font-bold"
                              : "bg-slate-950/60 border-slate-800 hover:bg-slate-800 text-slate-200"
                          }`}
                        >
                          <span className="text-3xl">{item.icon}</span>
                          <div>
                            <div className="text-xs font-bold">{item.name}</div>
                            <div className={`text-[10px] ${isSelected ? "text-slate-900" : "text-slate-400"}`}>
                              {item.desc}
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* STEP 2: BOTTOMS */}
              {activeStep === 2 && (
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <p className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                      Select 1 Bottom Item:
                    </p>
                    <span className="text-[11px] text-slate-500">Pick pants, shorts, or skirt</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    {CLOTHES_CATALOG.bottoms.map((item) => {
                      const isSelected = selectedBottom?.id === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => handleSelectItem('bottom', item)}
                          className={`p-3 rounded-xl border text-left flex items-center gap-3 transition-all active:scale-95 ${
                            isSelected
                              ? "bg-amber-400 border-amber-300 text-slate-950 shadow-md font-bold"
                              : "bg-slate-950/60 border-slate-800 hover:bg-slate-800 text-slate-200"
                          }`}
                        >
                          <span className="text-3xl">{item.icon}</span>
                          <div>
                            <div className="text-xs font-bold">{item.name}</div>
                            <div className={`text-[10px] ${isSelected ? "text-slate-900" : "text-slate-400"}`}>
                              {item.desc}
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* STEP 3: SHOES */}
              {activeStep === 3 && (
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <p className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                      Select 1 Footwear Item:
                    </p>
                    <span className="text-[11px] text-slate-500">Pick boots, sneakers, or sandals</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    {CLOTHES_CATALOG.shoes.map((item) => {
                      const isSelected = selectedShoes?.id === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => handleSelectItem('shoes', item)}
                          className={`p-3 rounded-xl border text-left flex items-center gap-3 transition-all active:scale-95 ${
                            isSelected
                              ? "bg-amber-400 border-amber-300 text-slate-950 shadow-md font-bold"
                              : "bg-slate-950/60 border-slate-800 hover:bg-slate-800 text-slate-200"
                          }`}
                        >
                          <span className="text-3xl">{item.icon}</span>
                          <div>
                            <div className="text-xs font-bold">{item.name}</div>
                            <div className={`text-[10px] ${isSelected ? "text-slate-900" : "text-slate-400"}`}>
                              {item.desc}
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>
          </div>

          {/* FEEDBACK & PROGRESSION BANNER */}
          {feedback && (
            <div className={`p-5 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl transition-all ${
              feedback.type === "success" 
                ? "bg-emerald-950/90 border-emerald-500/80 text-emerald-100" 
                : feedback.type === "error"
                ? "bg-rose-950/90 border-rose-500/80 text-rose-100"
                : "bg-amber-950/90 border-amber-500/80 text-amber-100"
            }`}>
              <div className="flex items-center gap-3 text-center sm:text-left">
                <span className="text-3xl">
                  {feedback.type === "success" ? "🌟" : feedback.type === "error" ? "🤔" : "💡"}
                </span>
                <div>
                  <h4 className="font-extrabold text-base">{feedback.title}</h4>
                  <p className="text-xs sm:text-sm mt-0.5 leading-relaxed">{feedback.message}</p>
                </div>
              </div>

              {feedback.type === "success" && (
                <button
                  onClick={handleNextLevel}
                  className="w-full sm:w-auto px-6 py-3 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black rounded-xl text-xs sm:text-sm transition transform active:scale-95 whitespace-nowrap shadow-md"
                >
                  Next Mission ➔
                </button>
              )}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
