<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outfit Quest: ADHD & ASD Dressing Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- UTILITY: ARRAY SHUFFLE (RANDOMIZER) ---
    const shuffleArray = (array) => {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    };

    // --- SOUND EFFECTS SYNTHESIZER ---
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'success') {
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
            const noteOsc = ctx.createOscillator();
            const noteGain = ctx.createGain();
            noteOsc.type = 'triangle';
            noteOsc.frequency.setValueAtTime(freq, now + index * 0.08);
            noteGain.gain.setValueAtTime(0.15, now + index * 0.08);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
            noteOsc.connect(noteGain);
            noteGain.connect(ctx.destination);
            noteOsc.start(now + index * 0.08);
            noteOsc.stop(now + index * 0.08 + 0.3);
          });
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch (e) {
        // Fallback for restricted audio autoplay
      }
    };

    // --- BILINGUAL DATA & EXPANDED CHALLENGES ---
    const TRANSLATIONS = {
      en: {
        title: "✨ Outfit Quest",
        subtitle: "Match the right outfit to the right mission!",
        missionLabel: "Mission",
        hintLabel: "💡 Hint:",

        chooseTitle: "Choose Outfit Items (Randomized!)",
        stepTop: "1. Choose Top",
        stepBottom: "2. Choose Bottom",
        stepShoes: "3. Choose Shoes",
        btnReady: "Ready to Go! 🚀",
        btnNext: "Next Mission ➔",
        selectFirst: "Choose all 3 items first! Top, Bottom, and Shoes.",
        perfectOutfit: "🎉 PERFECT OUTFIT! You're ready for the day!",
        tryAgain: "⚡ Almost! Check the weather and activity hints carefully!",
        scenarios: [
          {
            id: "rainy_school",
            title: "Rainy School Day 🌧️",
            weather: "Cold & Pouring Rain",
            activity: "Walking to school outdoors",
            requiredTags: ["rainproof", "warm", "waterproof_shoes"],
            hint: "Pick clothes that keep water out and keep you warm!"
          },
          {
            id: "gym_class",
            title: "Gym Class / Sports ⚽",
            weather: "Warm & Sunny",

            requiredTags: ["breathable", "stretchy", "athletic_shoes"],
            hint: "Avoid tight or stiff clothes! Pick flexible sports gear."
          },
          {
            id: "regular_school",
            title: "Regular School Day 🏫",
            weather: "Mild Indoor & Outdoor",
            activity: "Classroom learning & recess",
            requiredTags: ["casual_top", "comfortable_bottom", "casual_shoes"],
            hint: "Pick neat, comfortable everyday clothes for school."
          },
          {
            id: "fancy_party",
            title: "Grandma's Birthday Party 🎂",
            weather: "Mild Indoors",
            activity: "Family dinner celebration",
            requiredTags: ["fancy_top", "fancy_bottom", "clean_shoes"],
            hint: "Pick dressy and polite clothes for a celebration!"
          }
        ],
        clothes: {
          tops: [
            { id: "raincoat", name: "Yellow Raincoat 🧥", tags: ["rainproof", "warm"], icon: "🧥" },
            { id: "tshirt", name: "Sports T-Shirt 👕", tags: ["breathable"], icon: "👕" },
            { id: "fancy_shirt", name: "Button-Up Shirt 👔", tags: ["fancy_top"], icon: "👔" },
            { id: "school_polo", name: "School Uniform Polo 🎽", tags: ["casual_top"], icon: "🎽" },
            { id: "winter_coat", name: "Heavy Winter Parka 🦺", tags: ["too_hot", "warm"], icon: "🦺" }
          ],
          bottoms: [
            { id: "rain_pants", name: "Waterproof Rain Pants 👖", tags: ["rainproof", "warm"], icon: "👖" },
            { id: "shorts", name: "Athletic Shorts 🩳", tags: ["stretchy", "breathable"], icon: "🩳" },
            { id: "dress_pants", name: "Party Trousers / Skirt 👗", tags: ["fancy_bottom"], icon: "👗" },
            { id: "comfy_jeans", name: "Comfortable Jeans 👖", tags: ["comfortable_bottom"], icon: "👖" },
            { id: "swim_trunks", name: "Beach Swim Shorts 🩲", tags: ["too_casual"], icon: "🩲" }
          ],
          shoes: [
            { id: "boots", name: "Rain Boots 👢", tags: ["waterproof_shoes"], icon: "👢" },
            { id: "sneakers", name: "Running Sneakers 👟", tags: ["athletic_shoes"], icon: "👟" },
            { id: "fancy_shoes", name: "Shiny Party Shoes 👞", tags: ["clean_shoes"], icon: "👞" },
            { id: "casual_sneakers", name: "Casual Everyday Shoes 👟", tags: ["casual_shoes"], icon: "👟" },
            { id: "flipflops", name: "Beach Flip-Flops 🩴", tags: ["too_loose"], icon: "🩴" }
          ]
        }
      },
      th: {
        title: "✨ Outfit Quest (เกมแต่งกายตามสถานการณ์)",
        subtitle: "เลือกชุดแต่งกายให้เหมาะกับภารกิจประจำวัน!",
        missionLabel: "ภารกิจที่",
        hintLabel: "💡 คำแนะนำ:",
        avatarHeader: "ตัวละครของคุณ",
        chooseTitle: "เลือกตู้เสื้อผ้า (สุ่มตำแหน่งทุกครั้ง!)",
        stepTop: "1. เลือกเสื้อท่อนบน",
        stepBottom: "2. เลือกกางเกง/กระโปรง",
        stepShoes: "3. เลือกรองเท้า",
        btnReady: "พร้อมออกเดินทาง! 🚀",
        btnNext: "ภารกิจถัดไป ➔",
        selectFirst: "กรุณาเลือกเสื้อผ้าให้ครบทั้ง 3 ชิ้นก่อนครับ!",
        perfectOutfit: "🎉 ยอดเยี่ยมมาก! ชุดนี้เหมาะสมและพร้อมสำหรับวันนี้แล้ว!",
        tryAgain: "⚡ เกือบถูกแล้ว! ลองเช็คสภาพอากาศและกิจกรรมในคำใบ้อีกครั้งนะ",
        scenarios: [
          {
            id: "rainy_school",
            title: "วันไปโรงเรียนที่ฝนตก 🌧️",
            weather: "หนาว & ฝนตกหนัก",
            activity: "เดินไปโรงเรียนกลางแจ้ง",
            requiredTags: ["rainproof", "warm", "waterproof_shoes"],
            hint: "เลือกชุดกันฝนที่กันน้ำได้ดีและช่วยให้อบอุ่น!"
          },
          {
            id: "gym_class",
            title: "วิชาพละ / เล่นกีฬา ⚽",
            weather: "แดดจัด & อากาศร้อน",
            activity: "วิ่งออกกำลังกายในคาบพละ",
            requiredTags: ["breathable", "stretchy", "athletic_shoes"],
            hint: "หลีกเลี่ยงชุดเนื้อหนา! เลือกชุดกีฬาที่ยืดหยุ่นและระบายอากาศได้ดี"
          },
          {
            id: "regular_school",
            title: "วันเรียนปกติ 🏫",
            weather: "อากาศสบายๆ",
            activity: "เรียนในห้องเรียน & วิ่งเล่นพักกลางวัน",
            requiredTags: ["casual_top", "comfortable_bottom", "casual_shoes"],
            hint: "เลือกชุดนักเรียนหรือชุดเรียบร้อยที่ใส่สบายตลอดวัน"
          },
          {
            id: "fancy_party",
            title: "งานวันเกิดคุณยาย 🎂",
            weather: "ในห้องแอร์สบายๆ",
            activity: "ทานอาหารร่วมกับครอบครัว",
            requiredTags: ["fancy_top", "fancy_bottom", "clean_shoes"],
            hint: "เลือกชุดที่สุภาพ สวยงาม เหมาะกับงานเลี้ยง!"
          }
        ],
        clothes: {
          tops: [
            { id: "raincoat", name: "เสื้อกันฝนสีเหลือง 🧥", tags: ["rainproof", "warm"], icon: "🧥" },
            { id: "tshirt", name: "เสื้อยืดกีฬา 👕", tags: ["breathable"], icon: "👕" },
            { id: "fancy_shirt", name: "เสื้อเชิ้ตสุภาพ 👔", tags: ["fancy_top"], icon: "👔" },
            { id: "school_polo", name: "เสื้อโปโลนักเรียน 🎽", tags: ["casual_top"], icon: "🎽" },
            { id: "winter_coat", name: "เสื้อกันหนาวหนาพิเศษ 🦺", tags: ["too_hot", "warm"], icon: "🦺" }
          ],
          bottoms: [
            { id: "rain_pants", name: "กางเกงกันฝน 👖", tags: ["rainproof", "warm"], icon: "👖" },
            { id: "shorts", name: "กางเกงขาสั้นกีฬา 🩳", tags: ["stretchy", "breathable"], icon: "🩳" },
            { id: "dress_pants", name: "กางเกง/กระโปรงออกงาน 👗", tags: ["fancy_bottom"], icon: "👗" },
            { id: "comfy_jeans", name: "กางเกงขายาวใส่สบาย 👖", tags: ["comfortable_bottom"], icon: "👖" },
            { id: "swim_trunks", name: "กางเกงว่ายน้ำ 🩲", tags: ["too_casual"], icon: "🩲" }
          ],
          shoes: [
            { id: "boots", name: "รองเท้าบูทกันฝน 👢", tags: ["waterproof_shoes"], icon: "👢" },
            { id: "sneakers", name: "รองเท้าผ้าใบกีฬา 👟", tags: ["athletic_shoes"], icon: "👟" },
            { id: "fancy_shoes", name: "รองเท้าหนัง/ออกงาน 👞", tags: ["clean_shoes"], icon: "👞" },
            { id: "casual_sneakers", name: "รองเท้าลำลองใส่สบาย 👟", tags: ["casual_shoes"], icon: "👟" },
            { id: "flipflops", name: "รองเท้าแตะ 🩴", tags: ["too_loose"], icon: "🩴" }
          ]
        }
      }
    };

    function App() {
      const [lang, setLang] = useState('en');
      const [currentLevel, setCurrentLevel] = useState(0);
      const [selectedTop, setSelectedTop] = useState(null);
      const [selectedBottom, setSelectedBottom] = useState(null);
      const [selectedShoes, setSelectedShoes] = useState(null);
      const [feedback, setFeedback] = useState(null);

      // State to store shuffled clothes per level/lang change
      const [shuffledClothes, setShuffledClothes] = useState({
        tops: [],
        bottoms: [],
        shoes: []
      });

      const t = TRANSLATIONS[lang];
      const scenario = t.scenarios[currentLevel];

      // Shuffle options whenever level or language changes
      useEffect(() => {
        setShuffledClothes({
          tops: shuffleArray(t.clothes.tops),
          bottoms: shuffleArray(t.clothes.bottoms),
          shoes: shuffleArray(t.clothes.shoes)
        });
      }, [currentLevel, lang]);

      const handleSelect = (category, item) => {
        playSound('select');
        if (category === 'top') setSelectedTop(item);
        if (category === 'bottom') setSelectedBottom(item);
        if (category === 'shoes') setSelectedShoes(item);
      };

      const handleCheckOutfit = () => {
        if (!selectedTop || !selectedBottom || !selectedShoes) {
          playSound('error');
          setFeedback({ type: "warning", message: t.selectFirst });
          return;
        }

        const chosenTags = [
          ...selectedTop.tags,
          ...selectedBottom.tags,
          ...selectedShoes.tags
        ];

        const missing = scenario.requiredTags.filter(tag => !chosenTags.includes(tag));

        if (missing.length === 0) {
          playSound('success');
          setFeedback({
            type: "success",
            message: t.perfectOutfit
          });
        } else {
          playSound('error');
          setFeedback({
            type: "error",
            message: t.tryAgain
          });
        }
      };

      const handleNextLevel = () => {
        setSelectedTop(null);
        setSelectedBottom(null);
        setSelectedShoes(null);
        setFeedback(null);
        setCurrentLevel((prev) => (prev + 1) % t.scenarios.length);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 flex flex-col gap-6">
          {/* Header & Language Toggle */}
          <header className="relative text-center py-4 bg-slate-800 rounded-2xl shadow-lg border border-slate-700">
            <button
              onClick={() => setLang(lang === 'en' ? 'th' : 'en')}
              className="absolute right-4 top-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl border border-indigo-400 text-xs shadow transition"
            >
              🌐 {lang === 'en' ? 'ไทย' : 'English'}
            </button>
            <h1 className="text-3xl font-extrabold text-amber-400">{t.title}</h1>
            <p className="text-slate-400 text-sm mt-1">{t.subtitle}</p>
          </header>

          {/* Mission Card */}
          <div className="bg-gradient-to-r from-indigo-900 to-purple-900 p-6 rounded-2xl border border-indigo-500/30 shadow-md">
            <span className="text-xs font-bold tracking-wider uppercase text-indigo-300">
              {t.missionLabel} {currentLevel + 1} / {t.scenarios.length}
            </span>
            <h2 className="text-2xl font-bold mt-1 text-white">{scenario.title}</h2>
            <div className="flex flex-wrap gap-3 mt-3 text-sm">
              <span className="bg-indigo-950/80 px-3 py-1.5 rounded-full border border-indigo-700/80 text-indigo-200">
                🌡️ {scenario.weather}
              </span>
              <span className="bg-indigo-950/80 px-3 py-1.5 rounded-full border border-indigo-700/80 text-indigo-200">
                🎯 {scenario.activity}
              </span>
            </div>
            <p className="mt-4 text-amber-200 text-xs italic bg-amber-950/30 p-2.5 rounded-lg border border-amber-500/20">
              {t.hintLabel} {scenario.hint}
            </p>
          </div>

          <div className="grid md:grid-cols-3 gap-6">
            {/* Avatar Display Stage */}
            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col items-center justify-between min-h-[320px]">
              <h3 className="text-lg font-bold text-slate-300">{t.avatarHeader}</h3>
              
              <div className="relative flex flex-col items-center justify-center gap-2 bg-slate-900 p-6 rounded-xl w-full border border-slate-700 my-4 min-h-[180px]">
                <div className="text-5xl">🧑</div>
                <div className="text-3xl min-h-[40px] flex items-center">{selectedTop ? selectedTop.icon : "❓"}</div>
                <div className="text-3xl min-h-[40px] flex items-center">{selectedBottom ? selectedBottom.icon : "❓"}</div>
                <div className="text-3xl min-h-[40px] flex items-center">{selectedShoes ? selectedShoes.icon : "❓"}</div>
              </div>

              {/* Ready / Check Button */}
              <button
                onClick={handleCheckOutfit}
                className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg transition duration-200 active:scale-95"
              >
                {t.btnReady}
              </button>
            </div>

            {/* Wardrobe Selection */}
            <div className="md:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col gap-5">
              <h3 className="text-lg font-bold text-slate-300">{t.chooseTitle}</h3>

              {/* Tops */}
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider mb-2 font-semibold">{t.stepTop}</p>
                <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                  {shuffledClothes.tops.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleSelect('top', item)}
                      className={`p-2.5 rounded-xl border text-xs font-medium flex flex-col items-center gap-1 transition h-full justify-center ${
                        selectedTop?.id === item.id
                          ? "bg-indigo-600 border-indigo-400 text-white shadow-md scale-105"
                          : "bg-slate-700/50 border-slate-600 hover:bg-slate-700 text-slate-200"
                      }`}
                    >
                      <span className="text-2xl">{item.icon}</span>
                      <span className="text-[11px] leading-tight text-center">{item.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Bottoms */}
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider mb-2 font-semibold">{t.stepBottom}</p>
                <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                  {shuffledClothes.bottoms.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleSelect('bottom', item)}
                      className={`p-2.5 rounded-xl border text-xs font-medium flex flex-col items-center gap-1 transition h-full justify-center ${
                        selectedBottom?.id === item.id
                          ? "bg-indigo-600 border-indigo-400 text-white shadow-md scale-105"
                          : "bg-slate-700/50 border-slate-600 hover:bg-slate-700 text-slate-200"
                      }`}
                    >
                      <span className="text-2xl">{item.icon}</span>
                      <span className="text-[11px] leading-tight text-center">{item.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Shoes */}
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider mb-2 font-semibold">{t.stepShoes}</p>
                <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                  {shuffledClothes.shoes.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleSelect('shoes', item)}
                      className={`p-2.5 rounded-xl border text-xs font-medium flex flex-col items-center gap-1 transition h-full justify-center ${
                        selectedShoes?.id === item.id
                          ? "bg-indigo-600 border-indigo-400 text-white shadow-md scale-105"
                          : "bg-slate-700/50 border-slate-600 hover:bg-slate-700 text-slate-200"
                      }`}
                    >
                      <span className="text-2xl">{item.icon}</span>
                      <span className="text-[11px] leading-tight text-center">{item.name}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Feedback Display */}
          {feedback && (
            <div className={`p-4 rounded-xl border flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md ${
              feedback.type === "success" 
                ? "bg-emerald-950/90 border-emerald-500 text-emerald-200" 
                : feedback.type === "error"
                ? "bg-rose-950/90 border-rose-500 text-rose-200"
                : "bg-amber-950/90 border-amber-500 text-amber-200"
            }`}>
              <p className="font-semibold text-sm text-center sm:text-left">{feedback.message}</p>
              {feedback.type === "success" && (
                <button
                  onClick={handleNextLevel}
                  className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg text-sm shrink-0 shadow transition"
                >
                  {t.btnNext}
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
